<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Pai's Blog · 邀请访问</title>
  <link rel="stylesheet" href="/_invite/style.css">
  <script src="/_invite/session.js" defer></script>
</head>
<body>
  <main>
    <p class="site-name" lang="en">Pai's Blog</p>
    <h1>邀请访问</h1>
    <form id="invite-form" method="post">
      <label for="invite-code">邀请码</label>
      <div class="controls">
        <input id="invite-code" type="password" required maxlength="256" autocomplete="off" spellcheck="false">
        <button type="submit" disabled>解锁</button>
      </div>
      <p id="invite-status" role="status"></p>
    </form>
    <noscript>请启用 JavaScript 后重新打开本页。</noscript>
  </main>
</body>
</html>
